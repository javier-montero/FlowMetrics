services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowmetrics}
      POSTGRES_USER: ${POSTGRES_USER:-flowmetrics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowmetrics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: gunicorn app.main:app --bind 0.0.0.0:8000 --workers 2 --worker-class uvicorn_worker.UvicornWorker --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowmetrics}:${POSTGRES_PASSWORD:-flowmetrics}@db:5432/${POSTGRES_DB:-flowmetrics}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: